server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    absolute_redirect off;

    # Static export: index.html for /, $uri.html for clean routes.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Operator-mounted card config. 404 (no mount) -> client falls back to
    # the baked /services-default.json.
    location = /config/services.json {
        alias /config/services.json;
        default_type application/json;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
